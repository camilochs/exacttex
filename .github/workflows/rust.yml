name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # The parity suite skips, loudly, when node or the wasm target are
      # absent — which meant CI had been green while never running it. Node
      # ships on the runner; the target is installed above; and the guard
      # after the tests turns any skip line into a failure, so the suite
      # cannot fall silent again without CI saying so.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      # Clippy over the whole workspace and every target, because CI is what
      # fails and a per-crate run has passed while the workspace did not.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        # Without pipefail, a pipeline's status is `tee`'s — always zero — so
        # the gate below could see a skip but never a failure. That is the
        # exact shape it was installed to prevent, one layer down, and it
        # shipped a green run with a red test inside. Proven fixed by a
        # deliberate failure turning CI red before this comment was merged.
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-output.log

      - name: the parity suite ran rather than skipped
        run: '! grep -q "^skipped:" test-output.log'

  msrv:
    # Cargo.toml declares rust-version = "1.85"; a floor nobody builds on is
    # a claim, not a guarantee. This job builds the workspace on exactly that
    # toolchain. Tests stay on stable above — the floor promises "compiles",
    # not "every dev-dependency of the future works".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build on the declared floor
        run: cargo build --workspace --all-targets
