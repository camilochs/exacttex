[workspace]
resolver = "3"
members = ["crates/xtex-core", "crates/xtex-cli", "crates/xtex-lsp", "crates/xtex-wasm"]
# Experiments carry dependencies the compiler must not inherit through the lock
# file. They are built on their own.
exclude = ["tests/experiments", "crates/xtex-verify"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/camilochs/exacttex"
rust-version = "1.88"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The wasm artefact ships to browsers; docs/wasm.md quotes its size. Without
# this profile a release build weighed ~406 KB — the settings below are what
# make the documented number true.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
